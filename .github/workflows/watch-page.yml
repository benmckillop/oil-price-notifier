name: Watch oil price

on:
  schedule:
    - cron: "35 * * * *"   # Runs at 10 minutes past the hour, between 07:00 and 18:59
  workflow_dispatch:

permissions:
  contents: write           # needed to commit the snapshot back

env:
  WATCH_URL: "https://bangorfuels.com/order-oil/"
  PRODUCT_ID: "38"          # add-to-cart=38 is the 500L product
  PRODUCT_LABEL: "500L"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Fetch price
        run: |
          python - <<'PY'
          import os, re, sys, requests
          from bs4 import BeautifulSoup

          PRICE = re.compile(r"£\s?\d[\d,]*\.\d{2}")
          pid, label = os.environ["PRODUCT_ID"], os.environ["PRODUCT_LABEL"]

          def by_link(soup):
              link = soup.select_one(f'a[href*="add-to-cart={pid}"], [data-product_id="{pid}"]')
              node = link
              for _ in range(8):
                  if node is None:
                      return None
                  node = node.parent
                  if node is None:
                      return None
                  prices = set(PRICE.findall(node.get_text(" ", strip=True)))
                  if prices:
                      return prices.pop() if len(prices) == 1 else None
              return None

          def by_heading(soup):
              lines = [l.strip() for l in soup.get_text("\n", strip=True).splitlines() if l.strip()]
              for i, line in enumerate(lines):
                  if line.upper() == label.upper():
                      for nxt in lines[i + 1 : i + 4]:
                          if re.fullmatch(r"\d[\d,]*L", nxt, re.I):
                              break
                          m = PRICE.search(nxt)
                          if m:
                              return m.group(0)
              return None

          r = requests.get(
              os.environ["WATCH_URL"],
              headers={"User-Agent": "Mozilla/5.0 (price-watcher)"},
              timeout=30,
          )
          print(f"status={r.status_code} final_url={r.url} bytes={len(r.text)}")
          r.raise_for_status()

          soup = BeautifulSoup(r.text, "html.parser")
          for t in soup(["script", "style", "noscript"]):
              t.decompose()

          price = by_link(soup) or by_heading(soup)
          if not price:
              # Diagnostics: what did the runner actually receive?
              print("title:", soup.title.string if soup.title else None)
              print("add-to-cart occurrences:", r.text.count("add-to-cart"))
              print("first 500 chars of body text:")
              print(soup.get_text(" ", strip=True)[:500])
              sys.exit("Price not found by link or heading; see diagnostics above")

          print("price:", price)
          open("snapshot.new.txt", "w").write(price + "\n")
          PY

      - name: Compare with last snapshot
        id: diff
        run: |
          new=$(cat snapshot.new.txt)
          if [ ! -f snapshot.txt ]; then
            echo "First run: baseline is $new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            old=$(cat snapshot.txt)
            if [ "$old" != "$new" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "old=$old" >> "$GITHUB_OUTPUT"
              echo "new=$new" >> "$GITHUB_OUTPUT"
              printf '%s price changed: %s -> %s\n\n%s\n' \
                "$PRODUCT_LABEL" "$old" "$new" "$WATCH_URL" > message.txt
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          mv snapshot.new.txt snapshot.txt

      - name: Send email
        if: steps.diff.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.MAIL_TO }}
          from: Price Watcher <${{ secrets.SMTP_USER }}>
          subject: "Oil ${{ env.PRODUCT_LABEL }}: ${{ steps.diff.outputs.old }} -> ${{ steps.diff.outputs.new }}"
          body: file://message.txt

      - name: Commit snapshot
        run: |
          git config user.name "price-watcher"
          git config user.email "price-watcher@users.noreply.github.com"
          git add snapshot.txt
          git diff --cached --quiet || { git commit -m "Update snapshot" && git push; }
